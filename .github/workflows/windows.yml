name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install PyInstaller
        run: python -m pip install pyinstaller
      - name: Download ffmpeg (GPL build, to bundle)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $d = Get-ChildItem ffmpeg-dl -Directory | Select-Object -First 1
          Copy-Item "$($d.FullName)\bin\ffmpeg.exe" ffmpeg.exe
          Copy-Item "$($d.FullName)\LICENSE.txt" ffmpeg-LICENSE.txt
          $enc = & .\ffmpeg.exe -hide_banner -encoders
          if (-not ($enc -match "libx264")) { throw "this ffmpeg has no libx264" }
          if ($enc -match " hap ") { echo "::notice::ffmpeg has the HAP encoder" } else { echo "::warning::ffmpeg has no HAP encoder (HAP will not work on Windows)" }
      - name: Stage the app
        run: python windows/build_windows.py --ffmpeg ffmpeg.exe --ffmpeg-license ffmpeg-LICENSE.txt
      - name: Smoke test the staged app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build\win\spektronautilus\spektronautilus.exe -ArgumentList "--no-browser","--port","8791" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 6
          $h = @{ "X-Spk" = "1" }
          $r = Invoke-RestMethod -Uri http://127.0.0.1:8791/api/native -Headers $h
          echo $r
          if (-not $r.ok) { throw "bundled ffmpeg not found by the app" }
          $idx = Invoke-WebRequest -Uri http://127.0.0.1:8791/live-dj/ -UseBasicParsing
          if ($idx.StatusCode -ne 200) { throw "site not served" }
          Stop-Process -Id $p.Id -Force
      - name: Build the installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "0.0.0" }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" } else { $iscc = $iscc.Source }
          & $iscc "/DAppVersion=$v" windows\spektronautilus.iss
      - uses: actions/upload-artifact@v4
        with: { name: Spektronautilus-Setup, path: build/Spektronautilus-Setup.exe }
      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: gh release create "${{ github.ref_name }}" build/Spektronautilus-Setup.exe --generate-notes
        shell: pwsh
